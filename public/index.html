    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3eb" />
    <script>
      // Pick the theme before the page paints so it never flashes the wrong one.
      // Uses the visitor's saved choice if there is one, otherwise the device setting. See src/theme.js.
      (function () {
        var theme = 'light';
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') theme = saved;
          else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
